name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kensara
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bhulekh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install aiosqlite # For tests
        
    - name: Run Migrations
      env:
        DATABASE_URL: postgresql+psycopg://kensara:password@localhost:5432/bhulekh
      run: |
        alembic upgrade head
        
    - name: Run Tests
      env:
        SECRET_KEY: test-secret-key
      run: |
        cd api
        pytest tests/

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check
      run: npm run build
